<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>猫娘来咯</title>
  <link rel="icon" href="/img/cat.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body class="mobile-body">
  <main class="mobile-app">
    <header class="mobile-head">
      <button id="sessionsButton" class="mobile-icon" aria-label="切换会话">☰</button>
      <div><strong id="title">猫娘</strong><small id="subtitle">手机接入</small></div>
      <button id="newButton" class="mobile-icon" aria-label="新建会话">＋</button>
    </header>
    <aside id="sessionsPanel" class="mobile-sessions" hidden><div id="sessionsList"></div></aside>
    <section id="chat" class="mobile-chat" aria-live="polite"></section>
    <form id="composer" class="mobile-composer">
      <div class="mobile-tools">
        <button id="mobileImageButton" type="button" class="mobile-upload-button" title="上传图片">图片</button>
        <button id="mobileFileButton" type="button" class="mobile-upload-button" title="上传文件">文件</button>
        <button id="webSearchToggle" type="button" class="mobile-web-toggle"
                title="猫娘能否自己上网查。关（默认）：只有你说「搜/查」或知识库没材料时才联网">联网搜索：off</button>
        <input id="mobileImageInput" type="file" accept="image/*" hidden>
        <input id="mobileFileInput" type="file" hidden>
      </div>
      <textarea id="input" rows="1" maxlength="6000" placeholder="和猫娘说点什么…"></textarea>
      <button id="send" type="submit">发送</button>
    </form>
  </main>
  <script src="/js/app_m.js"></script>
</body>
</html>
